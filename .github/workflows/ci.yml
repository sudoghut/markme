name: ci

on:
  push:
    branches: [main]
  pull_request:
  # workflow_dispatch / schedule 会让 gitleaks-action 走**全历史**扫描分支；
  # push / pull_request 事件下它只扫本次 diff（见 secrets job 的说明）。
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1" # 每周一全历史扫一次

# 最小权限（§8.3）。仓库级默认也设为 read-only。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 pyproject.toml 的 requires-python 和 .python-version 保持一致。
  # 必须显式传给 setup-uv，否则 uv 会挑 runner 自带的解释器 ——
  # 而 uv.lock 里带着 python_full_version 的解析标记，换解释器会装出不同的包集合。
  PYTHON_VERSION: "3.13"

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Action 按 commit SHA 钉版本（§8.3），不用浮动 tag。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install (locked, hashes enforced)
        # --locked：uv.lock 与 pyproject.toml 不一致就**直接失败**，
        # 而不是悄悄重新解析出一组没人审过的依赖（§8.1.1）。
        # 注意不能用 --frozen —— 那是「跳过检查、照用 lock」，语义正好相反。
        run: uv sync --locked --all-extras

      - name: ruff (lint)
        run: uv run ruff check .

      - name: ruff (format)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: pytest
        # SUPABASE_URL / SUPABASE_ANON_KEY 是仓库 **Variables** 而不是 Secrets
        # （§8.4）。理由只有一条：**Secret 会在日志里被打码**，而这组测试
        # 排障时要看的正是 URL 和返回体。anon key 按设计可公开，打码只添乱。
        #
        # **不是**「这样 fork PR 也能跑」—— 那条理由曾经写在这里，它是假的：
        # GitHub 不把仓库 Variable 传给由 fork 的 pull_request 触发的工作流，
        # 和 Secret 是同一条限制，只是 Variables 的文档页对此只字未提。
        #
        # SUPABASE_TESTS_REQUIRED：凭证**本来就该到位**的地方（push、schedule、
        # 本仓库自己的 PR）置 1，此时缺凭证是失败而不是跳过。没有它，变量被误删 /
        # 改名 / 项目被暂停时 pytest 只打印「28 skipped」而 CI 全绿 ——
        # §13 押在这组测试上的那道防线就这样悄悄消失，而且（§7.2.1）
        # 正好是在没人盯着的稳定期。
        #
        # fork PR 置 0：它们拿不到变量，无条件置 1 会让**每一个外部贡献者的
        # 第一个 PR 都红**，还附带一句「去检查仓库变量」——而他们看不到那些变量。
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SUPABASE_TESTS_REQUIRED: >-
            ${{ (github.event_name != 'pull_request'
                 || github.event.pull_request.head.repo.full_name == github.repository)
                && '1' || '0' }}
        run: uv run pytest

  # §7.4：ci.yml 也要跑前端构建 —— 一个编译不过的前端不该合进 main。
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: next build
        # 构建期会去 config/ 直读 YAML（§6.1），所以不能只编译单个文件。
        # **不给真凭证**：页面必须在数据源不可达时也能构建出「数据暂不可用」
        # 那个态（§10.6），而不是构建失败 —— 这正好把那条验收标准变成 CI 的一部分。
        env:
          SUPABASE_URL: ""
          SUPABASE_ANON_KEY: ""
        run: npx next build

  # 公开仓库一旦泄露就是永久泄露（§8.3）。
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 全历史；schedule / workflow_dispatch 下 gitleaks 才扫得到

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # 没有这个 token，action 在 pull_request 路径上是无条件 process.exit(1)：
          # 它要靠 API 取 PR 的 commit 列表来定扫描范围。而 AGENTS.md 规定
          # 所有改动都走 PR —— 漏了它，CI 永远红，PR 永远合不了。
          # 在 permissions: contents: read 之下这个自动 token 也是只读的。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          # 只读 token 发不了 PR 评论，关掉以免在真出事那一次刷出误导性 warning。
          GITLEAKS_ENABLE_COMMENTS: "false"
