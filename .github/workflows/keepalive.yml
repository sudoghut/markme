name: keepalive

# 两件事（§7.4 / §8.6 / §12 #9 第 3 条）：
#
# 1. 极轻的探活，防 Supabase free tier 在长假期把项目暂停。
# 2. **跑一遍 invariants.sql。** 这条比探活重要得多：
#    那些断言断的是**线上数据库状态**，不是代码，而 ci.yml 的触发是
#    push + PR —— §7.2.1 已经指出这个项目的稳态是「跑得很好、没人再推代码」。
#    于是「有人在 SQL Editor 里关掉了 RLS」这类探测器，
#    **恰好在没人盯着的时候停止运行**。
#
# 含周末：§8.6 的暂停计时不认交易日。
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: '3.13'
      - run: uv sync --locked
      - name: 不变式（连库跑，以 pipeline_writer 身份）
        env:
          MARKME_DB_URL: ${{ secrets.MARKME_DB_URL }}
        run: uv run python -m pipeline.check_invariants
      - name: anon 越权集成测试（§9.3.3）
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          SUPABASE_TESTS_REQUIRED: '1'
        run: uv run pytest -q pipeline/tests/test_db_integration.py
      - name: 站点健康检查（§10.6 的状态码那一半）
        # **这一步才是「正确 HTTP 状态码」真正被用上的地方。**
        #
        # 页面本身做不了这件事：实测页面级 ISR 和 fetch 的 Data Cache
        # **都是** stale-while-revalidate —— 数据源死掉之后，访客拿到的
        # 一直是 200 + 缓存里的旧页面，抛出去的异常被吞成一行日志。
        # 见 web/app/api/health/route.ts 的文件头。
        #
        # /api/health 不带缓存，每次都真读一行。它同时覆盖两件事：
        # 数据库不可达，以及 §9.3 的 GRANT/RLS 被人在 Dashboard 里改掉
        # （那会长成 401/403）—— 后者正是 §12 #9 第 4 条点名的场景，
        # 而它恰恰不会让任何 workflow 变红，除非有人去看。
        #
        # 没配 SITE_URL 就跳过：它是可选的，缺它不该让这个 job 变红。
        #
        # **判据必须是 `vars.`，不能是 `env.`。** step 级的 `if` 在这个 step
        # **自己的 `env:` 块求值之前**就被求值，于是 `env.SITE_URL` 恒为 null、
        # 条件恒为假 —— 这一步每天都是 skipped，而 job 每天都是绿的。
        # 比变红更难发现：skipped 不发邮件、不变红、日志里也不显眼，
        # 于是「状态码归给 /api/health 再由 CI 断言」那个闭环是断的，没人知道。
        if: vars.SITE_URL != ''
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          HEALTH_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          # 不用 `code=$(curl ...)`：runner 的默认 shell 是 `bash -e`，
          # 连不上时 curl 非零会**直接终止这一步**，下面两行诊断输出一个字都拿不到。
          # 拆开写，把状态码和响应体都打出来再判。
          # 尾斜杠：SITE_URL 若带 `/`，拼出来是 `//api/health`，Next 会 308 规范化。
          base="${SITE_URL%/}"
          # production 也启用 Vercel Deployment Protection 时，认证会在请求到达
          # Route Handler **之前**拦住它。该 secret 是 Vercel 专给自动化的 bypass，
          # 只在已配置时附带，未启用保护的项目无需配置。
          headers=(-H "x-health-token: $HEALTH_TOKEN")
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            headers+=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET")
          fi
          set +e
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 30 "${headers[@]}" "$base/api/health")
          rc=$?
          set -e
          echo "curl exit=$rc http=$code"
          cat /tmp/health.json 2>/dev/null || echo '(没有响应体)'
          echo
          test "$code" = "200"
