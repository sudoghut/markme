name: heartbeat

# **GitHub 会在仓库 60 天无活动后自动停用 schedule 触发器**，
# 而 workflow 的「运行」不算仓库活动（提交才算）。
# 这个项目的稳态恰恰就是「跑得很好、没人再推代码」——
# 两个月后 daily.yml 会静悄悄地停掉，而停掉的表现是**沉默**（§7.2.1）。
#
# 每月一次轻量提交重置那个计时器，顺带做一次备份。
on:
  schedule:
    - cron: '11 7 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 更新心跳文件
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .heartbeat
          git config user.name  'markme-heartbeat'
          git config user.email '8538710+sudoghut@users.noreply.github.com'
          git add .heartbeat
          # **不要 `|| exit 0`。** `.heartbeat` 每次都会变，所以 commit 本该必然成功；
          # 吞掉它的失败（token 过期、分支保护、push 被拒）会让这个 job 常绿，
          # 而 60 天后 GitHub 会停用 schedule —— 管道就此**静默停摆**，
          # 而这个 workflow 存在的全部理由就是防止那件事。
          git commit -m "chore: heartbeat $(date -u +'%Y-%m')"
          git push

      # §9.4 的备份论证：**绝大部分数据都能从供应商重新推导**，所以影响低 ——
      # 但这是一个值得讲出来的论证，而不是省略掉。
      # 一个月度 pg_dump 近乎免费，买的是「供应商历史口径也一起变了」时的后悔药。
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: '3.13'
      - run: uv sync --locked
      # **`if: env.SECRET != ''` 是个静默的坑。** step 级 `if` 在该 step 自己的
      # `env:` 求值之前就被求值，所以那样写条件恒为假 —— 这两步会**永远 skipped**，
      # 而 job 永远是绿的：月度备份从来没跑过，也没人会发现。
      # `secrets` 上下文在 step 级 `if` 里同样不可用，所以先用一步把
      # 「配没配」变成一个**非敏感的 output**，secret 仍然只出现在它自己那一步里。
      - name: 有没有配 MARKME_DB_URL
        id: cfg
        env:
          MARKME_DB_URL: ${{ secrets.MARKME_DB_URL }}
        run: echo "have=${MARKME_DB_URL:+yes}" >> "$GITHUB_OUTPUT"
      - name: pg_dump 备份
        if: steps.cfg.outputs.have == 'yes'
        env:
          MARKME_DB_URL: ${{ secrets.MARKME_DB_URL }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          mkdir -p /tmp/backup
          pg_dump --no-owner --no-privileges --format=custom             --file="/tmp/backup/markme-$(date -u +'%Y-%m').dump" "$MARKME_DB_URL"
          ls -la /tmp/backup
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: steps.cfg.outputs.have == 'yes'
        with:
          name: pg_dump
          path: /tmp/backup
          retention-days: 90
