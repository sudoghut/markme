name: heartbeat

# **GitHub 会在仓库 60 天无活动后自动停用 schedule 触发器**，
# 而 workflow 的「运行」不算仓库活动（提交才算）。
# 这个项目的稳态恰恰就是「跑得很好、没人再推代码」——
# 两个月后 daily.yml 会静悄悄地停掉，而停掉的表现是**沉默**（§7.2.1）。
#
# 每月一次轻量提交重置那个计时器，顺带做一次备份。
on:
  schedule:
    - cron: '11 7 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 更新心跳文件
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .heartbeat
          git config user.name  'markme-heartbeat'
          git config user.email '8538710+sudoghut@users.noreply.github.com'
          git add .heartbeat
          git commit -m "chore: heartbeat $(date -u +'%Y-%m')" || exit 0
          git push

      # §9.4 的备份论证：**绝大部分数据都能从供应商重新推导**，所以影响低 ——
      # 但这是一个值得讲出来的论证，而不是省略掉。
      # 一个月度 pg_dump 近乎免费，买的是「供应商历史口径也一起变了」时的后悔药。
      - uses: astral-sh/setup-uv@f94ec6bedd8674c4426838e6b50417d36b6ab231 # v5.3.1
        with:
          enable-cache: true
          python-version: '3.13'
      - run: uv sync --locked
      - name: pg_dump 备份
        if: env.MARKME_DB_URL != ''
        env:
          MARKME_DB_URL: ${{ secrets.MARKME_DB_URL }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          mkdir -p /tmp/backup
          pg_dump --no-owner --no-privileges --format=custom             --file="/tmp/backup/markme-$(date -u +'%Y-%m').dump" "$MARKME_DB_URL"
          ls -la /tmp/backup
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: env.MARKME_DB_URL != ''
        env:
          MARKME_DB_URL: ${{ secrets.MARKME_DB_URL }}
        with:
          name: pg_dump
          path: /tmp/backup
          retention-days: 90
