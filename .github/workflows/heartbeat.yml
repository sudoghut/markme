name: heartbeat

# **GitHub 会在仓库 60 天无活动后自动停用 schedule 触发器**，
# 而 workflow 的「运行」不算仓库活动（提交才算）。
# 这个项目的稳态恰恰就是「跑得很好、没人再推代码」——
# 两个月后 daily.yml 会静悄悄地停掉，而停掉的表现是**沉默**（§7.2.1）。
#
# 每月一次轻量提交重置那个计时器，顺带做一次备份。
on:
  schedule:
    - cron: '11 7 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 更新心跳文件
        run: |
          date -u +'%Y-%m-%dT%H:%M:%SZ' > .heartbeat
          git config user.name  'markme-heartbeat'
          git config user.email '8538710+sudoghut@users.noreply.github.com'
          git add .heartbeat
          # **不要 `|| exit 0`。** `.heartbeat` 每次都会变，所以 commit 本该必然成功；
          # 吞掉它的失败（token 过期、分支保护、push 被拒）会让这个 job 常绿，
          # 而 60 天后 GitHub 会停用 schedule —— 管道就此**静默停摆**，
          # 而这个 workflow 存在的全部理由就是防止那件事。
          git commit -m "chore: heartbeat $(date -u +'%Y-%m')"
          git push

      # §9.4 的备份论证：**绝大部分数据都能从供应商重新推导**，所以影响低 ——
      # 但这是一个值得讲出来的论证，而不是省略掉。
      # 一个月度 pg_dump 近乎免费，买的是「供应商历史口径也一起变了」时的后悔药。
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: '3.13'
      - run: uv sync --locked
      # **`if: env.SECRET != ''` 是个静默的坑。** step 级 `if` 在该 step 自己的
      # `env:` 求值之前就被求值，所以那样写条件恒为假 —— 这两步会**永远 skipped**，
      # 而 job 永远是绿的：月度备份从来没跑过，也没人会发现。
      # `secrets` 上下文在 step 级 `if` 里同样不可用，所以先用一步把
      # 「配没配」变成一个**非敏感的 output**，secret 仍然只出现在它自己那一步里。
      - name: 有没有配 MARKME_BACKUP_URL
        id: cfg
        env:
          MARKME_BACKUP_URL: ${{ secrets.MARKME_BACKUP_URL }}
        run: echo "have=${MARKME_BACKUP_URL:+yes}" >> "$GITHUB_OUTPUT"
      - name: pg_dump 备份
        if: steps.cfg.outputs.have == 'yes'
        env:
          # **备份走 `backup_reader`，不是 `pipeline_writer`。**
          # 六张表都开了 RLS，而 writer 既不是 owner 也没有 BYPASSRLS，
          # 于是 pg_dump 拒绝导出（见 0002_backup_reader.sql 的文件头）。
          # backup_reader 是只读 + bypassrls 的专用角色。
          MARKME_BACKUP_URL: ${{ secrets.MARKME_BACKUP_URL }}
        run: |
          # **这个月度备份在修好之前一次都没成功过。**
          # `apt-get install postgresql-client` 在 ubuntu-24.04 上装到的是 16，
          # 而 Supabase 的服务端是 17.6，于是 pg_dump 直接拒绝：
          #   `aborting because of server version mismatch`
          # 2026-09-21 手动 dispatch 一次才撞见 —— 否则要等 10 月 1 号第一次
          # 定时跑才会暴露，而 §9.4 把这份 dump 当「后悔药」在论证。
          #
          # 规则是 **pg_dump 的大版本必须 ≥ 服务端**（反方向才是支持的：
          # 新客户端可以 dump 旧服务端）。所以：
          #   1. runner 自带的源里最新只到 16（实测），先按 PostgreSQL 官方文档
          #      把 PGDG 源加进来；
          #   2. 从里面取**最新**的那个 `postgresql-client-NN`，而不是钉死 17 ——
          #      服务端哪天升到 18，钉死 17 的那份会以同样的方式再红一次。
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc             -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main"             | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          PGV=$(apt-cache search --names-only '^postgresql-client-[0-9]+$' | awk '{print $1}' | sed 's/.*-//' | sort -n | tail -1)
          echo "服务端 17.6；PGDG 里最新的客户端大版本：$PGV"
          # 取不到、或取到的比服务端还旧，就**立刻停**，而不是让 pg_dump 去撞
          # 那条 version mismatch —— 失败信息要说清楚是哪一步不成立。
          test -n "$PGV" && [ "$PGV" -ge 17 ] || { echo "拿不到 >=17 的 pg_dump 客户端（PGV=$PGV）"; exit 1; }
          sudo apt-get install -y -qq "postgresql-client-$PGV"
          # **必须走版本化的那个二进制，不能直接叫 `pg_dump`。**
          # Debian/Ubuntu 的 `/usr/bin/pg_dump` 是 `pg_wrapper` 的软链，它按
          # **默认集群**的版本派发 —— runner 上装着 postgresql-16，所以哪怕
          # 刚装完 18，`pg_dump --version` 报的仍是 16.15，照样撞 mismatch。
          # （实测踩过：加完 PGDG 源、装上 18.6 之后仍然失败，就是卡在这里。）
          PGBIN="/usr/lib/postgresql/$PGV/bin/pg_dump"
          "$PGBIN" --version
          mkdir -p /tmp/backup
          # **只 dump 我们自己的两个 schema。** 整库 dump 会在 Supabase 的托管
          # schema 上直接失败（实测：`permission denied for schema auth`），
          # 而且就算有权限也不该备 —— `auth` 里是用户凭证，不该躺在一个
          # 保留 90 天的 artifact 里。§9.4 要的后悔药是**我们的数据**：
          # `public`（六张表 + 视图）与 `private`（runs / fetch_state）。
          "$PGBIN" --no-owner --no-privileges --format=custom --schema=public --schema=private --file="/tmp/backup/markme-$(date -u +'%Y-%m').dump" "$MARKME_BACKUP_URL"
          ls -la /tmp/backup
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.cfg.outputs.have == 'yes'
        with:
          name: pg_dump
          path: /tmp/backup
          retention-days: 90
