name: daily

# 美股正常收盘 16:00 ET，触发取**收盘 +330 分钟**（§7.1 / `config/app.yaml`）。
#
# **为什么是 5.5 小时而不是 1 小时。** 原设计假设「16:15–16:30 ET
# consolidated close 就稳定」。2026-09-29 的实测推翻了它：21:19 ET 时
# Yahoo 那根 bar 还是半根（只有 Open 与 Volume，`Close=NaN`），
# 22:15 ET 才结算完。按 +60 分钟去问，每跑都拿到「没有新 bar」，
# 记 `stale_vendor`（exit 1、告警）—— 一个每天响好几次的告警等于没有告警。
#
# **两条硬约束决定了下面这张表**：
#
# 1. `calendar_gate.when_to_run` 用的是 `now_et.date()`，会话必须等于
#    **当天 ET 日期**。跑过午夜 ET 就会挑到第二天的会话，
#    判 `skipped_too_early` / `skipped_holiday` —— exit 0、不告警、
#    当天数据**永久丢失**。所以每一跑都必须落在 ET 当日 24:00 之前。
# 2. **GitHub cron 会迟到。** 实测 2026-09-25…09-30 连续多日延后
#    约 3–3.6 小时。所以每条 cron 都要在「准时」和「迟到 3 小时」
#    两种落点下都成立，不能只算准时的那一种。
#
# 落点表（ET；✅=闸门 2 放行，—=太早记 skipped_too_early，✗=已过午夜、空转）：
#
# ==========  ===========  ===========  ===========  ===========
# cron (UTC)  EDT 准时      EDT 迟到 3h   EST 准时      EST 迟到 3h
# ==========  ===========  ===========  ===========  ===========
# ``0 22``    18:00 —      21:00 —      17:00 —      20:00 —
# ``0 23``    19:00 —      22:00 ✅      18:00 —      21:00 —
# ``0 0``     20:00 —      23:00 ✅      19:00 —      22:00 ✅
# ``0 1``     21:00 —      00:00 ✗      20:00 —      23:00 ✅
# ``0 2``     22:00 ✅      01:00 ✗      21:00 —      00:00 ✗
# ``30 3``    23:30 ✅      02:30 ✗      22:30 ✅      01:30 ✗
# ``30 4``    00:30 ✗      03:30 ✗      23:30 ✅      02:30 ✗
# ==========  ===========  ===========  ===========  ===========
#
# **四种情形各有 2 跑放行。** 多挂几条的代价极低：太早的记
# `skipped_too_early`（exit 0），已经成功过的记 `skipped_already_done`
# （exit 0，§7.1 的条件重试），落到午夜后的当场判掉，**都是 20 秒级的空转**。
#
# 跨午夜 UTC 的那几条必须写 `2-6`（周二到周六）：02:00Z 周六 = 21:00 ET 周五。
on:
  schedule:
    - cron: "0 22 * * 1-5" # EDT 18:00 ET / EST 17:00 ET
    - cron: "0 23 * * 1-5" # EDT 19:00 / EST 18:00
    - cron: "0 0 * * 2-6" # EDT 20:00（前一日）/ EST 19:00
    - cron: "0 1 * * 2-6" # EDT 21:00 / EST 20:00
    - cron: "0 2 * * 2-6" # EDT 22:00 / EST 21:00
    - cron: "30 3 * * 2-6" # EDT 23:30 / EST 22:30
    - cron: "30 4 * * 2-6" # EST 23:30（EDT 已过午夜，空转）
  workflow_dispatch:
    inputs:
      force:
        description: "已有 ok 记录也强制重跑"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: markme-daily
  # **不取消正在跑的，排队执行。** 取消会把 T2 打断在半路 ——
  # 数据会完整回滚（那没问题），但 runs 里会留下一行永远停在 running，
  # 而那是留给「硬崩溃」的信号。cron 延迟导致两跑重叠时不该发出那个信号。
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.13"

      - run: uv sync --locked

      - name: 跑管道
        # secret 挂在 **step 级**而非 job/workflow 级（§8.3）：
        # 上面的 checkout 与 uv sync 都不需要它。
        env:
          MARKME_DB_URL: ${{ secrets.MARKME_DB_URL }}
          GITHUB_SHA: ${{ github.sha }}
          # §10.1 的按需重验证。两者缺一就静默跳过。
          SITE_URL: ${{ vars.SITE_URL }}
          REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
          # production 开启 Vercel Deployment Protection 时，供 revalidate_site()
          # 在到达 Route Handler 前绕过保护；未配置时不发送该 header。
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: uv run python -m pipeline.run_daily ${{ inputs.force && '--force' || '' }}

      - name: 有没有配 HEALTHCHECK_URL
        id: hc
        if: success()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: echo "have=${HEALTHCHECK_URL:+yes}" >> "$GITHUB_OUTPUT"
      - name: dead-man's switch
        # §7.2.1：**沉默是这个设计里最危险的状态。**
        # Actions 的失败通知只能对「跑了并且失败」告警，对「根本没跑」永远沉默 ——
        # 而「管道不复存在」这一整类故障产出的正是沉默。
        # 成功时 ping 一个 URL，**没收到 ping 才是告警**。
        # 没配这个 secret 时静默跳过（它是可选的，缺它不该让管道变红）。
        # `if: env.SECRET != ''` 恒为假（step 级 if 在该 step 自己的 env 之前求值），
        # 而 `secrets` 上下文在 step 级 if 里也不可用 —— 见 heartbeat.yml 里的同款。
        # dead-man's switch 若永远 skipped，那就**正好**是它要防的那种沉默。
        if: success() && steps.hc.outputs.have == 'yes'
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: curl -fsS --retry 3 --max-time 20 "$HEALTHCHECK_URL" || true
