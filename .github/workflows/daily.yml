name: daily

# 美股正常收盘 16:00 ET。**两段式**（docs/provisional-close.md，M13）：
#
# - **临时跑**：收盘 +60 分钟（`settle_minutes`）起放行。日线这时还是半根 bar
#   （M12 实测），当天的收盘价取自 1 分钟线最后一根，标 `preliminary`，页面右上角提示。
# - **定稿**：收盘 +330 分钟（`final_settle_minutes`，21:30 ET）之后拿到的日线算定稿，
#   当晚能定就定；定不了的由**次日早上**的定稿跑补（下面两条 `* * *`，含周末）。
#
# 原则：**收盘后尽快出一个标明临时的结果；前一天及更早的历史必须是定稿数字。**
# （取代 M12 的「宁可晚几小时，不要一个会变的数字」—— 那条让 09-29 / 09-30
# 两天当天什么都没有。）
#
# **两条硬约束仍然决定晚间那几条的落点**：
#
# 1. `calendar_gate.when_to_run` 用 `now_et.date()` 找会话。跑过 ET 午夜的那一跑
#    不再属于当天 —— 但它**不再丢数据**：闸门没放行时，若上一个 session 在库里还不是
#    全员定稿，`run_daily` 会钳到那一天做定稿跑（早上那两条也走这条路）。
# 2. **GitHub cron 会迟到。** 实测 2026-09-25…09-30 连续多日延后约 3–3.6 小时。
#    所以每条都要在「准时」和「迟到 3 小时」两种落点下都算一遍。
#
# 落点表（ET；✅=闸门 2 放行，—=太早记 skipped_too_early，✗=已过午夜、转为定稿跑）：
#
# ==========  ===========  ===========  ===========  ===========
# cron (UTC)  EDT 准时      EDT 迟到 3h   EST 准时      EST 迟到 3h
# ==========  ===========  ===========  ===========  ===========
# ``0 21``    17:00 ✅      20:00 ✅      16:00 —      19:00 ✅
# ``0 22``    18:00 ✅      21:00 ✅      17:00 ✅      20:00 ✅
# ``0 23``    19:00 ✅      22:00 ✅      18:00 ✅      21:00 ✅
# ``0 0``     20:00 ✅      23:00 ✅      19:00 ✅      22:00 ✅
# ``0 1``     21:00 ✅      00:00 ✗      20:00 ✅      23:00 ✅
# ``0 2``     22:00 ✅      01:00 ✗      21:00 ✅      00:00 ✗
# ``30 3``    23:30 ✅      02:30 ✗      22:30 ✅      01:30 ✗
# ``30 4``    00:30 ✗      03:30 ✗      23:30 ✅      02:30 ✗
# ==========  ===========  ===========  ===========  ===========
#
# 第一跑就是「收盘 +1 小时」：EDT 准时 17:00、EST 准时 17:00；迟到 3h 时 19:00–20:00。
# 晚于 `vendor_deadline_et`（22:30）的那一跑在四种情形下都至少有一条 ——
# 由 test_schedule_dst.py 按 15 分钟粒度扫 0–4h 延迟绑住。
#
# 跑得多的代价：21:30 之前放行的每一跑都是临时结果（`ok_preliminary`，不算「做完了」），
# 下一条会再跑一次；拿到定稿之后的跑记 `skipped_already_done`，20 秒级空转。
#
# 跨午夜 UTC 的那几条必须写 `2-6`（周二到周六）：02:00Z 周六 = 21:00 ET 周五。
on:
  schedule:
    - cron: "0 21 * * 1-5" # EDT 17:00 ET（收盘 +1h）/ EST 16:00（太早）
    - cron: "0 22 * * 1-5" # EDT 18:00 / EST 17:00（收盘 +1h）
    - cron: "0 23 * * 1-5" # EDT 19:00 / EST 18:00
    - cron: "0 0 * * 2-6" # EDT 20:00（前一日）/ EST 19:00
    - cron: "0 1 * * 2-6" # EDT 21:00 / EST 20:00
    - cron: "0 2 * * 2-6" # EDT 22:00 / EST 21:00
    - cron: "30 3 * * 2-6" # EDT 23:30 / EST 22:30
    - cron: "30 4 * * 2-6" # EST 23:30（EDT 已过午夜，转为定稿跑）
    # 定稿跑：**每天**，含周末与假日 —— 周五的临时值由周六这一跑定稿，
    # 假日前一天的由假日当天定稿。迟到 4 小时也落在当天 17:00 ET（全日市开闸）之前，
    # 所以它们是「定稿上一个 session」，不会变成当天的临时跑。（半日市 14:00 开闸，
    # 迟到很多时可能顺手出当天的临时结果 —— 那本来就是想要的。）
    - cron: "0 13 * * *" # EDT 09:00 / EST 08:00
    - cron: "0 15 * * *" # EDT 11:00 / EST 10:00
  workflow_dispatch:
    inputs:
      force:
        description: "已有 ok 记录也强制重跑"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: markme-daily
  # **不取消正在跑的，排队执行。** 取消会把 T2 打断在半路 ——
  # 数据会完整回滚（那没问题），但 runs 里会留下一行永远停在 running，
  # 而那是留给「硬崩溃」的信号。cron 延迟导致两跑重叠时不该发出那个信号。
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.13"

      - run: uv sync --locked

      - name: 跑管道
        # secret 挂在 **step 级**而非 job/workflow 级（§8.3）：
        # 上面的 checkout 与 uv sync 都不需要它。
        env:
          MARKME_DB_URL: ${{ secrets.MARKME_DB_URL }}
          GITHUB_SHA: ${{ github.sha }}
          # §10.1 的按需重验证。两者缺一就静默跳过。
          SITE_URL: ${{ vars.SITE_URL }}
          REVALIDATE_TOKEN: ${{ secrets.REVALIDATE_TOKEN }}
          # production 开启 Vercel Deployment Protection 时，供 revalidate_site()
          # 在到达 Route Handler 前绕过保护；未配置时不发送该 header。
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: uv run python -m pipeline.run_daily ${{ inputs.force && '--force' || '' }}

      - name: 有没有配 HEALTHCHECK_URL
        id: hc
        if: success()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: echo "have=${HEALTHCHECK_URL:+yes}" >> "$GITHUB_OUTPUT"
      - name: dead-man's switch
        # §7.2.1：**沉默是这个设计里最危险的状态。**
        # Actions 的失败通知只能对「跑了并且失败」告警，对「根本没跑」永远沉默 ——
        # 而「管道不复存在」这一整类故障产出的正是沉默。
        # 成功时 ping 一个 URL，**没收到 ping 才是告警**。
        # 没配这个 secret 时静默跳过（它是可选的，缺它不该让管道变红）。
        # `if: env.SECRET != ''` 恒为假（step 级 if 在该 step 自己的 env 之前求值），
        # 而 `secrets` 上下文在 step 级 if 里也不可用 —— 见 heartbeat.yml 里的同款。
        # dead-man's switch 若永远 skipped，那就**正好**是它要防的那种沉默。
        if: success() && steps.hc.outputs.have == 'yes'
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: curl -fsS --retry 3 --max-time 20 "$HEALTHCHECK_URL" || true
