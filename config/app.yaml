# 运行参数（§6.1.1）。
#
# 单位规则：除 settle_minutes（分钟）、events_refresh_within_days（日历日）
# 与 vendor_deadline_et（**ET 墙上时刻**）外，
# 一律是**交易日**。混单位就是「90 天还是 90 个交易日」那类 bug 的出生地，
# 所以宁可在键名和注释里啰嗦。

site:
  title: "markme"
  subtitle: "market metrics"
  # 页脚免责声明。站点加了一道象征性密码（§10.5），理由见 README ——
  # 它是合规与成本措施，不是安全边界。
  disclaimer: "本站展示的是公开行情数据的统计派生量，不构成任何投资建议。数据来源与口径见方法论页。"
  # 页脚的源码链接。放这里是因为它是**这一份部署**的属性（fork 了就该改），
  # 与 title/subtitle 同类。反过来，「美东」「落后 7 天」那种由市场结构决定、
  # 不随部署变的常量留在代码里（`web/lib/market.ts`），不做成旋钮。
  repo_url: "https://github.com/sudoghut/markme"

# ── 时点与窗口 ─────────────────────────────────────────────────────────
# §7.2 闸门 2：收盘后多久才认为收盘价已定稿（分钟）。
#
# **60 是实测不成立的**（M12，2026-09-29）：Yahoo 要到 **22:15 ET 前后**
# 才结算完收盘价，在那之前给的是半根 bar（有 Open 与 Volume，`Close` 为 NaN）。
# 按收盘 +60 分钟去问，拿到的必然是「还没有新 bar」。
#
# 代价不是「少一天数据」，是**告警失效**：闸门 2 放行 → 抓取 → 全员落后
# → `stale_vendor`（exit 1、告警）。于是每个交易日都要响好几次，
# 而它本该只在数据源真坏了时响。
#
# 330 = 收盘 +5.5h → 全日市 21:30 ET 放行，略早于实测的可用时刻是**故意的**：
# 早的那几跑记 `skipped_too_early`（exit 0、不告警）。
# 完整的实测记录与落点表见 `docs/reviews/M12.md` 与 `.github/workflows/daily.yml`。
settle_minutes: 330

# §7.2 退出语义：`stale_vendor` 在这个 ET 时刻**之前**只记录、不告警。
#
# 「供应商还没出数」和「供应商坏了」是两件事，而闸门看到的现象一模一样。
# 区分它们的不是现象，是**当天还有没有补救机会**：这个时刻之前还有后续跑，
# 这时告警等于每天都响；到了它仍然空手，当天就真的没有了，
# 那才是需要人看一眼的信号。
#
# **这个数必须 <= 每种情形下「最晚那一跑」的落点**，否则当天没有任何一跑会走到
# 告警那一侧 —— 供应商整天不出数也悄无声息，比每天都红坏得多。
#
# 守着这条的是 `test_schedule_dst.py` 的
# `TestTheVendorDeadlineHasSomethingToLandOn` —— 它按 15 分钟粒度扫 0–4h 延迟，
# 改 cron 或改 settle_minutes 都会让它红。**别在这里重算，让测试说话。**
#
# 初稿写 23:00，因为只扫了 {0,1,2,3,3.6h} 几个整点延迟就当成了穷尽，
# 而 0.5h / 1.5h 延迟下有一整年的格子一跑都不会告警。
# **粗网格上的最小值不是最小值** —— 这是 M12 的教训，不是这个数的推导。
vendor_deadline_et: "22:30"

# §12 #5：回填深度 = 日常滚动重抓窗口，**同一个数**。
# 下界由 EMA(60) 的 6×N 收敛要求（360）决定，取整留裕量到 400。
# 注意它是 **bar 数**，换算成日期必须查交易日历，不能拿日历日硬换
# （400 个交易日 ≈ 574 个自然日；硬换只会拿到约 275 根，而没有任何东西会报警）。
lookback_bars: 400

# 全池表格每行的迷你走势（交易日）。
sparkline_bars: 60

# ── trading_sessions 的对账范围（§9.1.4）────────────────────────────────
# **固定，永不前移。** ordinal 每次对账都重新推导，
# 整套方案的正确性全押在左端点不动上：左端点一旦前移，
# v_strength_enriched 的 INNER join 会无声吞掉老行，
# 而幸存的第一行 prev_ord 为 NULL → days_in_top_n 悄悄归 1。
sessions_start_date: "2024-01-02"
# 向未来预填多少个**交易日**。
sessions_horizon: 60

# ── 事件抓取节奏（§3.5(4)）──────────────────────────────────────────────
# 财报日与分红日不会天天变，而这类数据**不可批量**（每标的 3 次请求），
# 所以默认每周只抓一次。
events_refresh_weekday: 3        # ISO 周内序号：1=周一 … 3=周三；非交易日顺延
events_refresh_within_days: 10   # 最近事件在此**日历日**数内 → 该标的改为每日刷新

# ── 抓取礼仪（§7.3.1）—— 我们不追求速度 ─────────────────────────────────
# 整个 run 花 5–10 分钟完全可以接受：收盘后数小时才跑的 EOD 看板，
# 没有任何理由跑得快，而 Actions 的 job 上限是 6 小时。
request_interval_seconds: 2      # 日常：每次供应商请求之间的间隔
backfill_interval_seconds: 5     # 回填是一次性大动作，更慢
max_requests_per_run: 200        # 硬上限，超出即中止并记 partial
retry_max_attempts: 3            # 退避有上限；等下一跑比死重试便宜

# ── 前端 ───────────────────────────────────────────────────────────────
# §10.1：对一天只变一次的数据，300 秒意味着每天 288 次重新生成。
# 真正的更新靠管道写完后的按需 revalidate。
revalidate_seconds: 3600
