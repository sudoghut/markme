# 三强股的排名规则（§4）。
#
# 摆正它的位置：**本项目不是一个榜单项目**。三强只是加在这批标的上的
# 又一个变量，与 RSI / EMA / α-β 平级。前端也不该让它占据头条（§10.2）。

# 主排序分。默认沿用 low-buy 已注册策略的那把尺子，但改为收盘口径。
score_metric: mom_20

# 排名池：stocks = 只含个股；all = 含 ETF。
#
# 默认只含个股的理由**不是**「QQQ 排不进前三」（QQQ 是 NDX-100 的加权平均，
# 不是这 16 只的平均），而是 **ETF 与单只个股的动量方差不可比** ——
# 把一个天然低波动的组合和 16 只单票放进同一个降序排名，
# 等于用一把刻度不同的尺子量两样东西。
rank_pool: stocks

# 榜单深度。全部名次都入库（§4.4），前端只显示前 top_n。
top_n: 3

# 并列时的确定性来源。注意：浮点数精确并列是零测度事件，
# **真正的确定性风险是 NaN**（§4.1），那由排名实现里的
# 「非有限值替换为 -inf + isfinite 掩码」处理，不靠这个键。
tie_break: symbol

# 「名次胶着」提示条的阈值（§10.3）。
#
# 不能用固定的 pp 值：这 16 只大型科技股的 20 日动量离散度在平静期约 2pp，
# 在 2020 年 3 月或财报周可达 25pp。固定 0.5pp 的切点在前一种状态下永不触发，
# 在后一种状态下一直触发 —— 警告最响的时候恰恰是排名分得最开的时候。
# 所以用池内得分标准差归一化。
squeak_k: 0.1

# 复合分（§4.3）。默认关闭 —— 复合分一旦引入就必须论证权重来源，
# 否则只是把任意性藏进小数点里。
composite:
  enabled: false
  w_mom: 1.0
  w_resid_vol: 0.0
